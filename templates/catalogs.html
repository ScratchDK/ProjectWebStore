<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Каталог</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="static/css/catalogs.css">
    <style>
        body {
            margin: 0;
        }
        .sidebar {
            width: 15%;
            height: 100vh;
            background-color: black;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            margin: 5px 0;
        }
        .content {
            margin-left: 15%;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            margin-left: 15%;
            margin-top: 5%;
        }
        .product-card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding-bottom: 5px;
            margin: 25px;
            width: 35%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .empty-img {
            width: auto;
            height: 200px;
            background: Grey;
        }
        .product-name {
            background: LightGrey;
            padding: 5px;
            font-size: 24px;
        }
        .product-price {
            padding: 5px;
            font-size: 48px;
        }
        .product-description {
            padding: 5px;
            font-size: 18px;
        }
        .btn-buy {
            width: 10%;
            color: DodgerBlue;
            border-color: DodgerBlue;
            font-size: 18px;
        }
        .sidebar .logo {
            text-align: center;
            margin-top: 10%
        }
        .sidebar a {
            font-size: 18px;
            margin-left: 10px;
        }
        .sidebar .nav {
            display: flex;
            flex-direction: column;
            margin-left: 20px;
            margin-top: 15%
        }
        .dropdown {
            position: absolute;
            display: inline-block;
            bottom: 5%;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: Grey;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 16px;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .btn-user {
            background: black;
            color: white;
            font-size: 16px;
        }
        .btn-panel {
            padding-top: 20px;
            padding-left: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h2 style="color: white; font-size: 36px;">Меню</h2>
        </div>
        <div class="nav">
            <a href="#home" ><i class="bi bi-house"></i> Главная</a>
            <a href="#about"><i class="bi bi-list"></i> Категории</a>
            <a href="#services"><i class="bi bi-cart"></i> Заказы</a>
            <a href="#contact"><i class="bi bi-person-lines-fill"></i> Контакты</a>
        </div>
        <div class="dropdown">
            <button class="btn-user">Текущий пользователь</button>
            <div class="dropdown-content">
                <a href="#profile">Профиль</a>
                <a href="#logout">Выход</a>
            </div>
        </div>
    </div>
    <div class="content">
        <h1 style="text-align:center; font-size: 48px;"><strong>Каталог</strong></h1>

        <div class="container">
            <div class="product-card">
                <div class="empty-img"></div>
                <div class="product-description">Описание</div>
                <div class="btn-panel">
                    <button class="btn-view">Просмотр</button>
                    <button class="btn-edit">Редактировать</button>
                </div>
            </div>
            <div class="product-card">
                <div class="empty-img"></div>
                <div class="product-description">Описание</div>
                <div class="btn-panel">
                    <button class="btn-view">Просмотр</button>
                    <button class="btn-edit">Редактировать</button>
                </div>
            </div>
            <div class="product-card">
                <div class="empty-img"></div>
                <div class="product-description">Описание</div>
                <div class="btn-panel">
                    <button class="btn-view">Просмотр</button>
                    <button class="btn-edit">Редактировать</button>
                </div>
            </div>
            <div class="product-card">
                <div class="empty-img"></div>
                <div class="product-description">Описание</div>
                <div class="btn-panel">
                    <button class="btn-view">Просмотр</button>
                    <button class="btn-edit">Редактировать</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
