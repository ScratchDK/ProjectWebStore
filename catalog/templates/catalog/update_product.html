{% extends 'catalog/base.html' %}

{% load static %}

{% block title %}Изменение продукта{% endblock %}

{% block style %}
    <link rel="stylesheet" href="{% static 'css/create_product.css' %}">
{% endblock %}

{% block content %}
<div class="content-create">
    <div class="form-container">
        <h1>Изменить продукт</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить продукт</button>
        </form>
        <a href="{% url 'catalog:home' %}">Вернуться к текущему продукту</a>
    </div>
</div>
{% endblock %}
